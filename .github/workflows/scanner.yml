name: Scanner

# Every hour, reads every source a watch list follows and saves the new stories to Supabase.
# It emails only the developer (ADMIN_EMAIL), when a source breaks. Scheduled runs only run from main.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *" # At :17, off the busy top of the hour, when GitHub delays more runs

permissions:
  contents: read

# One scan at a time: a slow run makes the next one wait instead of overlapping it.
concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The scanner needs only the runtime packages: the web app's build tools stay out.
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Scan
        env:
          # The cloud project's public address (also in .env.production).
          SUPABASE_URL: https://oggitszmyjqqfivrncgb.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: npm run scan
