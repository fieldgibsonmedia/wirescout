name: Wirescout

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *" # Run every 4 hours

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Grant permission to write changes to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The scanner needs only the runtime packages: the web app's build tools stay out.
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run scraper
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: npm start

      - name: Commit and push state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # pull latest changes to avoid conflicts
          git pull origin main --rebase || true
          # Ensure path matches src/state.json
          git add src/state.json
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push origin main
