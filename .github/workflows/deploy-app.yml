name: Deploy web app

# Publishes the web app to GitHub Pages (fieldgibsonmedia.github.io/wirescout/) on every push to main.
# The scanner's "Update state [skip ci]" commits don't trigger it.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Pages has no app routing: it serves 404.html for any unknown path, so email links like
      # /wirescout/confirm?… still open the app.
      - name: Serve the app for every path
        run: cp dist/index.html dist/404.html

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
